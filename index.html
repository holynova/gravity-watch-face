<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GravityWatch" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Gravity Watch Face · 3D 物理重力互动空间</title>
    <script defer src="https://cloud.umami.is/script.js" data-website-id="e01c9f78-4607-4e60-b01c-77c8190b12b4"></script>
  </head>
  <body>
    <main class="app-shell" id="appShell">
      <section class="screen-stage" id="screenStage" aria-label="物理重力互动屏幕">
        <canvas class="physics-canvas" id="physicsCanvas"></canvas>
        <div class="glass-sheen" aria-hidden="true"></div>

        <button class="sensor-cta" id="sensorCta" type="button" hidden>
          <span class="sensor-dot"></span>
          <span>开启重力感应</span>
        </button>

        <div class="scene-toast" id="sceneToast" aria-live="polite" hidden></div>

        <div class="mobile-dock" id="mobileDock">
          <button
            class="mobile-step-btn"
            id="mobilePrevBtn"
            type="button"
            aria-label="上一个场景"
            title="上一个场景"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6" />
            </svg>
          </button>
          <div class="mobile-swatch-bar" id="mobileSwatches" role="tablist" aria-label="切换场景主题"></div>
          <button
            class="mobile-step-btn"
            id="mobileNextBtn"
            type="button"
            aria-label="下一个场景"
            title="下一个场景"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6" />
            </svg>
          </button>
          <button class="mobile-icon-btn" id="mobileAudioBtn" type="button" aria-label="切换碰撞音效" title="碰撞音效">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M11 5L6 9H2v6h4l5 4V5z" />
              <path class="sound-wave" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" />
              <path class="sound-mute-x" d="M16 9l5 6M21 9l-5 6" />
            </svg>
          </button>
          <button
            class="mobile-icon-btn"
            id="mobileHapticsBtn"
            type="button"
            aria-label="切换震动反馈"
            aria-pressed="true"
            title="震动反馈"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="8" y="4" width="8" height="16" rx="2" />
              <path class="haptic-waves" d="M4.5 8.5v7M2 10.5v3M19.5 8.5v7M22 10.5v3" />
            </svg>
          </button>
          <button
            class="mobile-icon-btn"
            id="mobileFullscreenBtn"
            type="button"
            aria-label="一键全屏"
            aria-pressed="false"
            title="一键全屏"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3" />
            </svg>
          </button>
          <a
            class="mobile-icon-btn mobile-repo-link"
            href="https://github.com/holynova/gravity-watch-face"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="GitHub 仓库"
            title="GitHub 仓库"
          >
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M12 2C6.48 2 2 6.59 2 12.25c0 4.53 2.87 8.37 6.84 9.73.5.09.68-.22.68-.49 0-.24-.01-.88-.01-1.72-2.78.62-3.37-1.38-3.37-1.38-.45-1.18-1.11-1.5-1.11-1.5-.91-.64.07-.62.07-.62 1 .07 1.53 1.06 1.53 1.06.89 1.56 2.34 1.11 2.91.85.09-.66.35-1.11.63-1.37-2.22-.26-4.56-1.14-4.56-5.08 0-1.12.39-2.04 1.03-2.76-.1-.26-.45-1.31.1-2.72 0 0 .84-.28 2.75 1.05A9.3 9.3 0 0 1 12 6.8c.85 0 1.71.12 2.51.35 1.91-1.33 2.75-1.05 2.75-1.05.55 1.41.2 2.46.1 2.72.64.72 1.03 1.64 1.03 2.76 0 3.95-2.34 4.82-4.57 5.07.36.32.68.94.68 1.9 0 1.37-.01 2.48-.01 2.82 0 .27.18.59.69.49A10.26 10.26 0 0 0 22 12.25C22 6.59 17.52 2 12 2z" />
            </svg>
          </a>
        </div>
      </section>

      <aside class="side-rail" id="sideRail" aria-label="桌面调试与传感器模拟面板">
        <header class="rail-header">
          <div>
            <p class="rail-eyebrow">GRAVITY PLAYGROUND</p>
            <h1 class="rail-title">物理重力桌面</h1>
          </div>
          <span class="mode-badge" id="modeBadge" data-mode="simulated">倾角模拟</span>
        </header>

        <section class="rail-section">
          <div class="section-head">
            <span>场景主题 <span class="section-subtitle" id="themeSubtitle">Diamonds Vault</span></span>
            <div class="theme-stepper">
              <button class="stepper-btn" id="desktopPrevBtn" type="button" aria-label="上一个场景" title="上一个场景">‹</button>
              <span class="theme-counter" id="themeCounter">1/18</span>
              <button class="stepper-btn" id="desktopNextBtn" type="button" aria-label="下一个场景" title="下一个场景">›</button>
            </div>
          </div>
          <div class="theme-grid" id="desktopThemes" role="tablist" aria-label="桌面主题切换"></div>
        </section>

        <section class="rail-section">
          <div class="section-head">
            <span>360° 倾角模拟摇杆</span>
            <button class="text-btn" id="resetTiltBtn" type="button">归位</button>
          </div>
          <div class="gyro-pad-wrap">
            <div class="gyro-pad" id="gyroPad" role="slider" aria-label="模拟手机倾斜方向" tabindex="0">
              <div class="gyro-ring gyro-ring--outer"></div>
              <div class="gyro-ring gyro-ring--inner"></div>
              <div class="gyro-crosshair-h"></div>
              <div class="gyro-crosshair-v"></div>
              <div class="gyro-puck" id="gyroPuck"></div>
            </div>
          </div>
          <p class="pad-caption">拖动摇杆或使用方向键 / WASD 倾斜重力，点击屏幕可拨动物体</p>
        </section>

        <section class="rail-section">
          <div class="action-grid">
            <button class="action-btn" id="shakeBtn" type="button">摇一摇</button>
            <button class="action-btn" id="demoBtn" type="button" aria-pressed="false">自动演示</button>
            <button class="action-btn" id="audioBtn" type="button" aria-pressed="false">碰撞音效</button>
            <button class="action-btn" id="hapticsBtn" type="button" aria-pressed="true">震动已开</button>
            <button class="action-btn" id="fullBleedBtn" type="button" aria-pressed="false">一键全屏</button>
            <button class="action-btn" id="resetBtn" type="button">重置场景</button>
          </div>
        </section>

        <footer class="telemetry-bar" id="telemetryBar">
          <span>G: <strong id="telemetryText">0.0, -24.0, -7.5</strong></span>
          <span class="telemetry-meta">
            <span class="app-version">v1.2.0</span>
            <span aria-hidden="true">·</span>
            <a
              class="repo-link"
              href="https://github.com/holynova/gravity-watch-face"
              target="_blank"
              rel="noopener noreferrer"
            >GitHub</a>
          </span>
        </footer>
      </aside>

      <button class="exit-fullbleed-btn" id="exitFullBleedBtn" type="button" hidden>
        退出全屏
      </button>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
